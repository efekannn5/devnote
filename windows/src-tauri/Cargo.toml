[package]
name = "devnote"
version = "0.1.0"
description = "DevNote — Windows"
authors = ["Efekan"]
license = ""
edition = "2021"
rust-version = "1.80"

[lib]
name = "devnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tiny_http = "0.12"
base64 = "0.22"
url = "2"
tauri-plugin-deep-link = "2"

[profile.release]
# Paketleyici (UPX vb.) yok: antivirüsler sıkıştırılmış exe'leri şüpheli bulur
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
